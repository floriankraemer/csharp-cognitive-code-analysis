name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore "CognitiveCodeAnalysis.sln"
    
    - name: Build
      run: dotnet build "CognitiveCodeAnalysis.sln" --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test "CognitiveCodeAnalysis.sln" --no-build --configuration Release --verbosity normal